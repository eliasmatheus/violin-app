<!DOCTYPE html>
<html lang="pt-br" data-theme="darkblue">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LouvorJA Violin</title>
  <script>
    // O main process já validou o ID. Aplicar antes da folha evita um frame
    // claro ao abrir o splash com o tema escuro.
    const theme = new URLSearchParams(location.search).get("theme");
    if (theme) document.documentElement.dataset.theme = theme;
  </script>
  <link rel="stylesheet" href="../src/assets/styles/tokens.css" />
  <style>
    :root {
      color-scheme: light;
      --splash-bg: var(--lj-color-splash-bg, #f7fafd);
      --splash-title: var(--lj-navy-dark, #143a66);
      --splash-muted: var(--lj-text-muted, #505e6e);
      --splash-accent: #a56300;
      --splash-icon-start: color-mix(in srgb, var(--lj-navy, #1b4f8a) 8%, #fff);
      --splash-icon-end: color-mix(in srgb, var(--lj-navy, #1b4f8a) 15%, #fff);
      --splash-icon-border: color-mix(in srgb, var(--lj-navy, #1b4f8a) 25%, #fff);
      --splash-spinner-track: color-mix(in srgb, var(--lj-navy, #1b4f8a) 20%, transparent);
      --splash-spinner-active: var(--lj-navy-dark, #143a66);
      --splash-logo-shadow: rgba(15, 64, 104, 0.16);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --splash-bg: var(--lj-surface-bg, #1f2937);
      --splash-title: var(--lj-text, #e5e7eb);
      --splash-muted: var(--lj-text-muted, #9aa3ad);
      --splash-accent: var(--lj-orange, #f39c12);
      --splash-icon-start: var(--lj-surface-bg-hover, #243248);
      --splash-icon-end: var(--lj-surface-bg-soft, #161e2c);
      --splash-icon-border: var(--lj-surface-border, #2a3441);
      --splash-spinner-track: rgba(229, 231, 235, 0.2);
      --splash-spinner-active: var(--lj-orange, #f39c12);
      --splash-logo-shadow: rgba(0, 0, 0, 0.38);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--splash-bg);
      color: var(--splash-title);
      font-family: "Tahoma", "Segoe UI", "Helvetica Neue", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .splash {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: stretch;
      animation: splash-fade-in 256ms ease-out;
    }
    @keyframes splash-fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .splash--leaving {
      animation: splash-fade-out 256ms ease-out forwards;
    }
    @keyframes splash-fade-out {
      from { opacity: 1; }
      to   { opacity: 0; }
    }

    .splash-icon {
      /* Quadrado do tamanho da altura que a janela realmente entregou, e não
         117px fixos. O Windows não devolve ao conteúdo a altura pedida na
         BrowserWindow, e o painel excedente saía cortado por baixo, levando o
         logo junto. */
      aspect-ratio: 1;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, var(--splash-icon-start), var(--splash-icon-end));
      border-right: 1px solid var(--splash-icon-border);
    }

    .splash-logo {
      height: 69%;
      width: auto;
      filter: drop-shadow(0 3px 5px var(--splash-logo-shadow));
    }

    .splash-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 14px 22px;
      gap: 6px;
    }

    .splash-title {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--splash-title);
      line-height: 1;
    }

    .splash-title b { color: var(--splash-accent); }

    .splash-subtitle {
      font-size: 13px;
      font-weight: 400;
      color: var(--splash-muted);
      line-height: 1;
      letter-spacing: 0.02em;
    }

    .splash-info {
      margin-top: 8px;
      font-size: 11px;
      color: var(--splash-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .splash-spinner {
      width: 12px;
      height: 12px;
      border: 2px solid var(--splash-spinner-track);
      border-top-color: var(--splash-spinner-active);
      border-radius: 50%;
      animation: splash-spin 0.7s linear infinite;
    }

    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="splash" id="splash-root">
    <div class="splash-icon">
      <img class="splash-logo" src="../public/ico/favicon.svg" alt="LouvorJA Violin" />
    </div>
    <div class="splash-content">
      <div class="splash-title">Louvor<b>JA</b></div>
      <div class="splash-info">
        <span class="splash-spinner"></span>
        <span>Inicializando programa...</span>
      </div>
    </div>
  </div>
</body>
</html>
